<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIたなかたかし — いろいろ質問どうぞ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>AIたなかたかし</h1>
      <p class="subtitle">なんでもきいてみてください。気軽にどうぞ。</p>
    </header>

    <section id="self-intro-section" class="card">
      <h2>たなかたかしについて</h2>
      <div id="self-intro" aria-live="polite">
        <p class="status-note">読み込み中…</p>
      </div>
    </section>

    <section id="recent-section" class="card">
      <h2>最近のこと</h2>
      <p id="recent-summary" class="recent-summary">最近のことは X（<a href="https://x.com/tatmos">@tatmos</a>）で発信しています。下のタイムラインで見てください。</p>
      <div class="twitter-embed" aria-label="X タイムライン">
        <a class="twitter-timeline" data-dnt="true" data-theme="dark" data-chrome="noheader nofooter noborders" href="https://x.com/tatmos">Tweets by tatmos</a>
      </div>
    </section>

    <section id="chat-section" class="card">
      <h2>なんでも聞いて</h2>
      <form id="chat-form" class="chat-form">
        <label for="chat-input" class="visually-hidden">質問を入力</label>
        <input type="text" id="chat-input" class="chat-input" placeholder="何がやりたいですか？ 開発したゲームは？ など" autocomplete="off">
        <button type="submit" class="chat-submit">送信</button>
      </form>
      <p class="faq-label">よくある質問</p>
      <div id="faq-buttons" class="faq-buttons" aria-live="polite"></div>
      <div id="current-qa" class="current-qa" aria-live="polite" aria-label="直近の質問と回答">
        <p class="current-qa-placeholder">質問を送信すると、ここに Q と A が表示されます。</p>
      </div>
      <button type="button" id="chat-history-btn" class="chat-history-btn" aria-expanded="false" aria-controls="chat-history-container">履歴</button>
      <div id="chat-history-container" class="chat-history-container is-hidden" aria-label="会話履歴">
        <div id="chat-history" class="chat-history" aria-live="polite"></div>
      </div>
    </section>

    <section id="timeline-section" class="card" aria-label="タイムライン（仮）">
      <h2>タイムライン（仮）</h2>
      <p id="timeline-summary" class="timeline-summary"></p>
      <div id="timeline-view" class="timeline-view" aria-live="polite">
        <p class="status-note">読み込み中…</p>
      </div>
    </section>

    <footer>
      <p class="footer-links">読み込み中…</p>
    </footer>
  </main>
  <script src="js/definition-loader.js"></script>
  <script src="js/rules-engine.js"></script>
  <script src="js/chat-ui.js"></script>
  <script src="js/app.js"></script>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</body>
</html>
